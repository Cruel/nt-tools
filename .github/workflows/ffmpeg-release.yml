name: FFmpeg Release

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'Upstream FFmpeg release number (e.g. 7.1.5, not a branch or n-prefixed tag)'
        required: true
        default: '7.1.5'
        type: string
      release_tag:
        description: 'New GitHub release tag and title (e.g. ffmpeg-r1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ffmpeg-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  NOVELTEA_FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
  NOVELTEA_FFMPEG_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  prepare:
    name: Validate release and select exact source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject invalid or existing release tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          [[ "$RELEASE_TAG" != -* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > existing-tags.txt
          if [[ -s existing-tags.txt ]]; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-releases.txt; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Download requested upstream release and freeze its checksum
        run: python3 ffmpeg/package.py select ffmpeg-selected-source "$NOVELTEA_FFMPEG_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-selected-source
          path: ffmpeg-selected-source/
          if-no-files-found: error

  build:
    name: FFmpeg (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-selected-source
          path: ffmpeg-selected-source
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make python
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - name: Build and certify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ffmpeg/certify.sh ffmpeg-selected-source
      - name: Build and certify (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: bash ffmpeg/certify.sh ffmpeg-selected-source
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-binary-${{ matrix.platform }}
          path: |
            ffmpeg-build/noveltea-ffmpeg-${{ matrix.platform }}.tar.gz
            ffmpeg-build/noveltea-ffmpeg-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish separate FFmpeg release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-binary-*
          path: release-assets
          merge-multiple: true
      - name: Create release without overwriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          # Recheck after the builds, in case another publisher used the name.
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > existing-tags.txt
          if [[ -s existing-tags.txt ]]; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c ./*.sha256)
          gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.sha256 \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes "NovelTea private FFmpeg $NOVELTEA_FFMPEG_VERSION authoring/export tools for Linux x64, Windows x64 and macOS arm64. Includes SHA-256 checksums, exact corresponding sources, build records, provenance and license notices."
