name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  PACKAGE_NAME: noveltea-bgfx-shaderc-linux-x64

jobs:
  release:
    name: Build and release shaderc
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build curl zip unzip tar git pkg-config \
            autoconf autoconf-archive automake libtool libltdl-dev bison flex \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxtst-dev

      - name: Cache pinned bgfx shaderc source
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
          key: ${{ runner.os }}-noveltea-shaderc-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-noveltea-shaderc-

      - name: Configure pinned static shaderc closure
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and stage static shaderc closure
        run: |
          set -euxo pipefail
          cmake --build build --target noveltea_shaderc_bundle
          cmake --install build --prefix stage
          test -f stage/lib/libnoveltea_bgfx_shaderc_embedded.a
          test -f stage/cmake/noveltea_shaderc_toolchain.cmake
          test -f stage/resources/bgfx_shader.sh

      - name: Package static shaderc closure
        id: package
        run: |
          set -euxo pipefail
          ARCHIVE="${PACKAGE_NAME}.tar.gz"
          cat > "stage/VERSION.txt" <<EOF
          package: $PACKAGE_NAME
          tag: ${{ github.ref_name }}
          target: linux-x64
          bgfx_cmake_release: v1.129.8940-496
          bgfx_cmake_sha256: 0fa0482d3b09ae262c9c7fc54a7193022510313f1250077caad5ff18504fce02
          built_at_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          tar -C stage -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "${{ github.ref_name }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
