name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 6
  PACKAGE_NAME: noveltea-bgfx-shaderc-linux-x64

jobs:
  release:
    name: Build and release shaderc and texturec
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build curl zip unzip tar git pkg-config \
            autoconf autoconf-archive automake libtool libltdl-dev bison flex \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxtst-dev

      - name: Cache pinned bgfx shaderc source
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
          key: ${{ runner.os }}-noveltea-shaderc-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-noveltea-shaderc-

      - name: Configure pinned static shaderc closure
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and stage static tool closure
        run: |
          set -euxo pipefail
          cmake --build build --target noveltea_shaderc_bundle
          cmake --install build --prefix stage
          test -x stage/bin/shaderc
          test -f stage/lib/libnoveltea_bgfx_shaderc_embedded.a
          test -f stage/lib/libnoveltea_bimg_texturec_embedded.a
          test -f stage/lib/libbimg_decode.a
          test -f stage/lib/libbimg_encode.a
          test -f stage/lib/libminiz.a
          test -f stage/cmake/noveltea_shaderc_toolchain.cmake
          test -f stage/resources/bgfx_shader.sh
          test -f stage/resources/bgfx_compute.sh
          nm --defined-only stage/lib/libminiz.a \
            | grep -E '[[:space:]]T[[:space:]]tinfl_decompress$' >/dev/null
          if nm --defined-only stage/lib/libbimg.a stage/lib/libbimg_decode.a \
              | grep -E '[[:space:]]T[[:space:]]tinfl_decompress$' >/dev/null; then
            echo 'bimg archives contain a second miniz implementation' >&2
            exit 1
          fi

      - name: Verify imported targets and PIC closure
        run: |
          set -euxo pipefail
          cmake -S tests/consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOVELTEA_TOOLCHAIN_FILE="$PWD/stage/cmake/noveltea_shaderc_toolchain.cmake"
          cmake --build consumer-build
          ctest --test-dir consumer-build --output-on-failure

      - name: Package static tool closure
        id: package
        run: |
          set -euxo pipefail
          ARCHIVE="${PACKAGE_NAME}.tar.gz"
          cmake \
            -DOUTPUT="$PWD/stage/VERSION.txt" \
            -DPACKAGE_NAME="$PACKAGE_NAME" \
            -DTAG="${{ github.ref_name }}" \
            -P cmake/write-version.cmake
          tar -C stage -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-release
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  ffmpeg:
    name: FFmpeg (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make python
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - name: Build and certify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ffmpeg/certify.sh
      - name: Build and certify (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: bash ffmpeg/certify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: |
            ffmpeg-build/noveltea-ffmpeg-${{ matrix.platform }}.tar.gz
            ffmpeg-build/noveltea-ffmpeg-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish certified tool artifacts
    needs: [release, ffmpeg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "$RELEASE_TAG" --generate-notes
